# Vhost nginx interne pour gateway-for-ebp.
# Écoute en HTTP seul : le TLS est assuré par le reverse-proxy de l'utilisateur
# (Traefik, nginx, Caddy…) placé devant ce conteneur.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Taille des corps de requête relayés vers l'API EBP (imports, pièces jointes).
    client_max_body_size 50m;

    # On fait confiance à l'en-tête du reverse-proxy pour le schéma réel (https).
    # (Laravel lit X-Forwarded-* via la config des trusted proxies.)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fichiers cachés : on bloque tout sauf .well-known (ACME, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180s;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
