; Réglages PHP de production pour gateway-for-ebp.

; --- Limites ---
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 52M
max_execution_time = 180

; --- Erreurs : jamais affichées au client en production ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- Fuseau par défaut (surchargé par APP_TIMEZONE de Laravel) ---
date.timezone = UTC

; --- OPcache : indispensable en prod ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Le code ne change pas dans une image immuable : pas de revalidation disque.
opcache.validate_timestamps = 0
opcache.save_comments = 1
