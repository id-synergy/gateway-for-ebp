; Pool php-fpm pour gateway-for-ebp.
; Écoute en TCP sur 9000 (nginx y pointe via fastcgi_pass 127.0.0.1:9000).

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Gestion dynamique des workers : à ajuster selon la RAM de la machine.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Les logs partent sur la sortie du conteneur (collectés par Docker).
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
