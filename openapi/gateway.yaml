openapi: 3.0.3
info:
  title: Gateway API EBP
  description: 'Passerelle d''accès à l''API EBP SaaS Gestion. Les applications s''authentifient par un jeton d''app (Bearer gw_...) ; le compte EBP et le dossier sont résolus par la gateway.


    PROXY TRANSPARENT : toute requête (tout verbe, lecture ET écriture) dont le chemin commence par un préfixe EBP autorisé est relayée telle quelle vers EBP. Les chemins ci-dessous ne sont que des EXEMPLES — tout endpoint EBP sous un préfixe autorisé fonctionne. FolderId implicite (résolu par le jeton, ou passé en ?folderId=).


    Lectures mises en cache (contournable par ?noCache=1 ou Cache-Control: no-cache) ; une écriture invalide le cache du dossier. Sous charge, une lecture bascule en job (202 + jobId).

    '
  version: 0.1.0
servers:
- url: /
  description: Cette instance
- url: https://gateway.example.com
  description: Production (à configurer au déploiement)
security:
- appToken: []
tags:
- name: Santé
- name: Jobs
- name: Composite
- name: Gestion
- name: Gestion Commerciale TPE
- name: Comptabilité TPE
- name: Bâtiment
- name: Import
- name: Export
- name: Maintenance
paths:
  /api/v1/ping:
    get:
      tags:
      - Santé
      summary: Vérifie que la gateway répond
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
      operationId: gateway-ping
  /api/v1/whoami:
    get:
      tags:
      - Santé
      summary: Contexte résolu pour le jeton (app, compte EBP, dossier)
      description: 'Écho du contexte résolu par la gateway pour le jeton présenté : nom de l''application, libellé du compte EBP et dossier par défaut. Sert à vérifier l''authentification et la résolution compte/dossier. `folder` vaut null si le jeton n''a pas de dossier par défaut.

        '
      responses:
        '200':
          description: Contexte du jeton
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                    description: Nom de l'application cliente
                  account:
                    type: string
                    description: Libellé du compte EBP
                  folder:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      label:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: gateway-whoami
  /api/v1/batch:
    post:
      tags:
      - Composite
      summary: Lot de requêtes de lecture (sous-jobs regroupés)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requests
              properties:
                requests:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - key
                    - endpoint
                    properties:
                      key:
                        type: string
                      endpoint:
                        type: string
                      query:
                        type: object
                        additionalProperties: true
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
      operationId: gateway-batch
  /api/v1/compose:
    post:
      tags:
      - Composite
      summary: Requête composite (liste puis sous-requête par élément, ex. CA par client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - list
              - itemKey
              - perItem
              properties:
                list:
                  type: object
                  required:
                  - endpoint
                  properties:
                    endpoint:
                      type: string
                    query:
                      type: object
                      additionalProperties: true
                itemKey:
                  type: string
                  description: Champ identifiant de chaque élément
                perItem:
                  type: object
                  required:
                  - endpointTemplate
                  properties:
                    endpointTemplate:
                      type: string
                      description: Peut contenir {item}
                    queryParam:
                      type: string
                      nullable: true
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '422':
          $ref: '#/components/responses/BadRequest'
      operationId: gateway-compose
  /api/v1/jobs:
    get:
      tags:
      - Jobs
      summary: Liste des jobs du jeton (les plus récents d'abord)
      description: 'Liste les jobs lancés par le jeton appelant. Filtre `status` : un statut précis, ou `in_progress` (raccourci pending+running = jobs en cours). Paginé.

        '
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - in_progress
          - pending
          - running
          - done
          - partial
          - failed
        description: Filtre d'état ; `in_progress` = pending + running
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Liste paginée des jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobStatus'
                  paging:
                    type: object
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: gateway-jobs-list
  /api/v1/jobs/{jobId}:
    get:
      tags:
      - Jobs
      summary: Statut et progression d'un job
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Statut du job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: gateway-job-status
  /api/v1/jobs/{jobId}/result:
    get:
      tags:
      - Jobs
      summary: Résultat d'un job terminé
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Résultat
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    enum:
                    - done
                    - partial
                    - failed
                  result:
                    type: object
                    additionalProperties: true
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
        '409':
          description: Job non terminé
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: gateway-job-result
  /gescom/api/v1/Folders:
    get:
      summary: Obtenir les dossiers de gestion
      description: ''
      operationId: gescom-get-v1-folders
      parameters:
      - name: Offset
        in: query
        required: false
        description: 'Permet de définir le décalage, les "Offset" premiers résultats à ignorer - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 0
      - name: Limit
        in: query
        required: false
        description: 'Permet de définir le nombre d''éléments à afficher - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 100
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        shortName:
                          type: string
                  paging:
                    type: object
                    properties:
                      total:
                        type: integer
                      returned:
                        type: integer
                      offset:
                        type: integer
                      limit:
                        type: integer
              example:
                folders:
                - id: '3691'
                  name: INV40V12_C3
                  shortName: INV40
                paging:
                  total: 1
                  returned: 1
                  offset: 0
                  limit: 100
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/Folders/{FolderId}/GenericQuery:
    get:
      summary: Obtenir le résultat d'une requête générique
      description: Cette requête permet d’aller interroger une table de la base d’un dossier client parmi une liste de tables autorisées.
      operationId: gescom-get-v1-folders-folderid-genericquery-byfolder
      parameters:
      - name: FolderId
        in: path
        required: true
        description: Identifiant du dossier.
        schema:
          type: string
      - name: TableName
        in: query
        required: true
        description: Nom de la table
        schema:
          type: string
      - name: Columns
        in: query
        required: false
        description: Permet de définir les colonnes de la table "TableName" pour l'obtention des résultats.
        schema:
          type: string
      - name: FromModifiedDate
        in: query
        required: false
        description: 'Permet de filtrer les résultats modifiés après cette date - Format : date-time (as date-time in RFC3339).'
        schema:
          type: string
          format: date-time
      - name: OrderByValue
        in: query
        required: false
        description: Permet de définir une colonne pour trier les résultats - Obligatoire pour la pagination.
        schema:
          type: string
      - name: WhereCondition
        in: query
        required: false
        description: Permet de filtrer les résultats en insérant un filtre générique - Se reporter à la documentation en ligne pour le format de ce filtre. Lien
        schema:
          type: string
      - name: Offset
        in: query
        required: false
        description: 'Permet de définir le décalage, les "Offset" premiers résultats à ignorer - Format : int32.'
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        required: false
        description: 'Permet de définir le nombre d''éléments à afficher - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 100
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties: {}
                  paging:
                    type: object
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      returned:
                        type: integer
              example:
                results: {}
                paging:
                  offset: 0
                  limit: 0
                  total: 0
                  returned: 0
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/GenericQuery:
    get:
      summary: Obtenir le résultat d'une requête générique
      description: Cette requête permet d’aller interroger une table de la base d’un dossier client parmi une liste de tables autorisées.
      operationId: gescom-get-v1-folders-folderid-genericquery
      parameters:
      - name: folderId
        in: query
        required: false
        schema:
          type: string
        description: Dossier ciblé ; résolu par le jeton d'app si absent.
      - name: TableName
        in: query
        required: true
        description: Nom de la table
        schema:
          type: string
      - name: Columns
        in: query
        required: false
        description: Permet de définir les colonnes de la table "TableName" pour l'obtention des résultats.
        schema:
          type: string
      - name: FromModifiedDate
        in: query
        required: false
        description: 'Permet de filtrer les résultats modifiés après cette date - Format : date-time (as date-time in RFC3339).'
        schema:
          type: string
          format: date-time
      - name: OrderByValue
        in: query
        required: false
        description: Permet de définir une colonne pour trier les résultats - Obligatoire pour la pagination.
        schema:
          type: string
      - name: WhereCondition
        in: query
        required: false
        description: Permet de filtrer les résultats en insérant un filtre générique - Se reporter à la documentation en ligne pour le format de ce filtre. Lien
        schema:
          type: string
      - name: Offset
        in: query
        required: false
        description: 'Permet de définir le décalage, les "Offset" premiers résultats à ignorer - Format : int32.'
        schema:
          type: integer
          format: int32
      - name: Limit
        in: query
        required: false
        description: 'Permet de définir le nombre d''éléments à afficher - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 100
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties: {}
                  paging:
                    type: object
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      returned:
                        type: integer
              example:
                results: {}
                paging:
                  offset: 0
                  limit: 0
                  total: 0
                  returned: 0
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/Folders/{FolderId}/GenericQuery/{id}:
    get:
      summary: Obtenir le résultat d'une requête générique pour un identifiant de table spécifique
      description: Cette requête permet d’aller interroger une table de la base d’un dossier client parmi une liste de tables autorisées pour un id sur la clé primaire de la table.
      operationId: gescom-get-v1-folders-folderid-genericquery-id-byfolder
      parameters:
      - name: FolderId
        in: path
        required: true
        description: Valeur de l'identifiant.
        schema:
          type: string
      - name: TableName
        in: query
        required: true
        description: Nom de la table.
        schema:
          type: string
      - name: Columns
        in: query
        required: false
        description: Permet de définir les colonnes de la table "TableName" pour l'obtention des résultats.
        schema:
          type: string
      - name: Id
        in: query
        required: false
        description: Valeur de l'identifiant.
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties: {}
              example:
                results: {}
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/GenericQuery/{id}:
    get:
      summary: Obtenir le résultat d'une requête générique pour un identifiant de table spécifique
      description: Cette requête permet d’aller interroger une table de la base d’un dossier client parmi une liste de tables autorisées pour un id sur la clé primaire de la table.
      operationId: gescom-get-v1-folders-folderid-genericquery-id
      parameters:
      - name: folderId
        in: query
        required: false
        schema:
          type: string
        description: Dossier ciblé ; résolu par le jeton d'app si absent.
      - name: TableName
        in: query
        required: true
        description: Nom de la table.
        schema:
          type: string
      - name: Columns
        in: query
        required: false
        description: Permet de définir les colonnes de la table "TableName" pour l'obtention des résultats.
        schema:
          type: string
      - name: Id
        in: query
        required: false
        description: Valeur de l'identifiant.
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    properties: {}
              example:
                results: {}
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/Dependencies/{TableName}:
    get:
      summary: Obtenir les tables secondaires autorisées
      description: ''
      operationId: gescom-get-v1-dependencies-tablename
      parameters:
      - name: TableName
        in: path
        required: true
        description: Nom de la table.
        schema:
          type: string
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkedTables:
                    type: array
                    items:
                      type: string
              example:
                linkedTables:
                - Unit
                - VolumeUnit
                - Vat
                - '...'
                - '...'
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/Folders/{FolderId}/Clients:
    get:
      summary: Obtenir les clients (customer)
      description: Cette requête récupère tous les clients d’un dossier avec gestion des droits. C’est une requête mise à disposition et optimisée pour des appels dans des interfaces utilisateurs (exemple Mobilité).
      operationId: gescom-get-v1-folders-folderid-clients-byfolder
      parameters:
      - name: FolderId
        in: path
        required: true
        description: Identifiant du dossier.
        schema:
          type: string
      - name: TypeClient
        in: query
        required: false
        description: Permet de filtrer en fonction du type de client - (null pour les avoir tous).
        schema:
          type: string
      - name: SearchTerm
        in: query
        required: false
        description: Permet de filtrer en fonction de la colonne "Id" ou de la colonne "Name".
        schema:
          type: string
      - name: Offset
        in: query
        required: false
        description: 'Permet de définir le décalage, les "Offset" premiers résultats à ignorer - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 0
      - name: Limit
        in: query
        required: false
        description: 'Permet de définir le nombre d''éléments à afficher - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 100
      - name: noCache
        in: query
        required: false
        schema:
          type: boolean
        description: Contourne le cache de lecture de la gateway.
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: object
                          properties:
                            value:
                              type: string
                            hasRight:
                              type: boolean
                        name:
                          type: object
                          properties:
                            value:
                              type: string
                            hasRight:
                              type: boolean
                        homePhoneNumber:
                          type: object
                          properties:
                            value:
                              type: string
                            hasRight:
                              type: boolean
                        mobilePhoneNumber:
                          type: object
                          properties:
                            value:
                              type: string
                            hasRight:
                              type: boolean
                        email:
                          type: object
                          properties:
                            value:
                              type: string
                            hasRight:
                              type: boolean
                        soldeEchu:
                          type: object
                          properties:
                            value:
                              type: integer
                            hasRight:
                              type: boolean
                            displayName:
                              type: string
                            currency:
                              type: string
                        clientType:
                          type: object
                          properties:
                            value:
                              type: string
                            hasRight:
                              type: boolean
                  paging:
                    type: object
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      returned:
                        type: integer
              example:
                clients:
                - code:
                    value: string
                    hasRight: true
                  name:
                    value: string
                    hasRight: true
                  homePhoneNumber:
                    value: string
                    hasRight: true
                  mobilePhoneNumber:
                    value: string
                    hasRight: true
                  email:
                    value: string
                    hasRight: true
                  soldeEchu:
                    value: 0
                    hasRight: true
                    displayName: string
                    currency: string
                  clientType:
                    value: string
                    hasRight: true
                paging:
                  offset: 0
                  limit: 0
                  total: 0
                  returned: 0
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/EbpUpstreamError'
        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      tags:
      - Gestion
  /gescom/api/v1/Clients:
    get:
      summary: Obtenir les clients (customer)
      description: Cette requête récupère tous les clients d’un dossier avec gestion des droits. C’est une requête mise à disposition et optimisée pour des appels dans des interfaces utilisateurs (exemple Mobilité).
      operationId: gescom-get-v1-folders-folderid-clients
      parameters:
      - name: folderId
        in: query
        required: false
        schema:
          type: string
        description: Dossier ciblé ; résolu par le jeton d'app si absent.
      - name: TypeClient
        in: query
        required: false
        description: Permet de filtrer en fonction du type de client - (null pour les avoir tous).
        schema:
          type: string
      - name: SearchTerm
        in: query
        required: false
        description: Permet de filtrer en fonction de la colonne "Id" ou de la colonne "Name".
        schema:
          type: string
      - name: Offset
        in: query
        required: false
        description: 'Permet de définir le décalage, les "Offset" premiers résultats à ignorer - Format : int32.'
        schema:
          type: integer
          format: int32
          default: 0
      - name: Limit
