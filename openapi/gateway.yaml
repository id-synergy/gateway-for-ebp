                    type: boolean
                    description: Ne pas lettrer
                  uuid:
                    type: string
                    description: Identifiant de la ligne, utilisé en édition seulement
                  identifiantProvisoireEcriture:
                    type: string
                    description: Sert à identifier l'écriture de la ligne
                  date:
                    type: string
                    format: date-time
                    description: Date d'écriture
                  generalAccount:
                    type: string
                    description: Compte général
                  auxiliaryAccount:
                    type: string
                    description: Compte de tiers
                  label:
                    type: string
                    description: Libellé
                  debit:
                    description: 'Type EBP : float Débit'
                  credit:
                    description: 'Type EBP : float Crédit'
                  piece:
                    type: string
                    description: Numéro de pièce
                  documentNumber:
                    type: string
                    description: Numéro de document
                  deadline:
                    type: string
                    format: date-time
                    description: Date d'échéance
                  attachmentUuid:
                    type: string
                    description: Identifiant de pièce jointe
