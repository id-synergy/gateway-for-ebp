components:
  securitySchemes:
    appToken:
      type: http
      scheme: bearer
      description: Jeton d'app émis par la gateway (format gw_...).
  schemas:
    JobStatus:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - simple
          - compose
          - batch
        status:
          type: string
          enum:
          - pending
          - running
          - done
          - partial
          - failed
        progress:
          type: object
          properties:
            done:
              type: integer
            total:
              type: integer
        pollIntervalHint:
          type: integer
          description: Intervalle de polling conseillé (secondes)
        finishedAt:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        message:
          type: string
    GatewayError:
      type: object
      properties:
        error:
          type: string
          description: Code machine de l'erreur
        message:
          type: string
          description: Message lisible
        ebpStatus:
          type: integer
          description: Statut HTTP EBP d'origine, si applicable
  responses:
    DataList:
      description: Liste de données
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  additionalProperties: true
    EbpList:
      description: Données EBP normalisées
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  additionalProperties: true
              paging:
                type: object
                nullable: true
                additionalProperties: true
              folder:
                type: string
    JobAccepted:
      description: Requête basculée en job (polling)
      content:
        application/json:
          schema:
            type: object
            properties:
              jobId:
                type: string
                format: uuid
              status:
                type: string
              pollIntervalHint:
                type: integer
    Unauthorized:
      description: Jeton manquant, invalide ou révoqué
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Requête invalide (ex. aucun dossier ciblé)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Quota EBP ou rate-limit de la gateway atteint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    EbpUpstreamError:
      description: L'API EBP a renvoyé une erreur (relayée en 502).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
    EbpAccountUnauthenticated:
      description: 'Compte EBP non connecté : à reconnecter dans le back-office (503).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayError'
