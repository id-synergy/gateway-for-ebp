        '503':
          $ref: '#/components/responses/EbpAccountUnauthenticated'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryMode:
                  type: string
                journal:
                  type: string
                linesEdition:
                  type: array
                  items:
                    type: object
                    properties:
                      temporaryIdentifier:
                        type: string
                      date:
                        type: string
                      generalAccount:
                        type: string
                      auxiliaryAccount:
                        type: string
                      label:
                        type: string
                      debit:
                        type: string
                      credit:
                        type: string
                      piece:
                        type: string
                      documentNumber:
                        type: string
                      deadline:
                        type: string
                linesDeletion:
                  type: array
                  items: {}
                verification:
                  type: boolean
                avoidLettering:
                  type: string
            example:
              entryMode: Provisoire
              journal: VE
              linesEdition:
              - temporaryIdentifier: 7baaa886-97f1-49fc-b7b9-29109af95c30
                date: '2024-01-13'
                generalAccount: '411'
                auxiliaryAccount: C0000001
                label: Test vente
                debit: '123'
                credit: '0'
                piece: '12345'
                documentNumber: '54321'
                deadline: '2024-01-13'
              - temporaryIdentifier: 7baaa886-97f1-49fc-b7b9-29109af95c30
                date: '2024-01-13'
                generalAccount: '701'
                label: Test vente
                debit: '0'
                credit: '123'
                piece: '12345'
                documentNumber: '54321'
              linesDeletion: []
              verification: true
              avoidLettering: 'true'
      tags:
      - Comptabilité TPE
